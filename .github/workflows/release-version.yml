name: Publish new theme version

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "*" # Push events to matching any tag format, i.e. 1.0, 20.15.10

# actions/create-release@v1 + actions/upload-release-asset@v1 (the
# previous implementation) are both archived and, on repos where the
# default GITHUB_TOKEN is read-only, fail with a 403 before ever
# creating the release. Replaced with the gh CLI (preinstalled on
# ubuntu-latest) per the official guide:
# https://docs.obsidian.md/Themes/App+themes/Release+your+theme+with+GitHub+Actions
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" --title="$tag" --generate-notes manifest.json theme.css
